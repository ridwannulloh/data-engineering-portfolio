[project]
name = "ch-etl"
version = "0.1.0"
description = "ETL pipelines tuned for ClickHouse Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.8",
    "python-dotenv>=1.0",
]

[project.scripts]
ch-etl = "ch_etl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ch_etl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a configured ClickHouse and reads the real TLC file"]
