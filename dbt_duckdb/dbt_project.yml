name: "portfolio_dbt"
version: "1.0.0"
config-version: 2

profile: "portfolio_duckdb"

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  portfolio_dbt:
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]

    marts:
      +schema: marts
      +materialized: table
      +tags: ["marts"]

seeds:
  portfolio_dbt:
    +quote_columns: false
    raw:
      # Emulates the Bronze/ODS layer landed by AWS DMS in the real pipeline.
      +schema: raw
